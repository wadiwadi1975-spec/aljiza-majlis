<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>اختبار الدخول</title></head>
<body style="font-family:Cairo,sans-serif;max-width:400px;margin:50px auto;text-align:center">
<h2>اختبار تسجيل الدخول</h2>
<input id="phone" placeholder="الهاتف" value="0999999999" style="width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px"><br>
<input id="pass" type="password" placeholder="كلمة المرور" value="admin123" style="width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px"><br>
<button onclick="testLogin()" style="width:100%;padding:12px;background:#094239;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer">دخول</button>
<button onclick="location.href='/admin'" style="width:100%;padding:12px;background:#b9a779;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:8px">دخول لوحة التحكم ←</button>
<pre id="result" style="text-align:left;background:#f5f5f5;padding:12px;margin-top:16px;border-radius:8px;font-size:13px;white-space:pre-wrap"></pre>
<script>
async function testLogin() {
  var log = '';
  try {
    log += '1. إرسال طلب الدخول...\n';
    var r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: document.getElementById('phone').value, password: document.getElementById('pass').value})
    });
    log += '2. الحالة: ' + r.status + '\n';
    var data = await r.json();
    log += '3. الاستجابة: ' + JSON.stringify(data, null, 2) + '\n';
    if (data.accessToken) {
      log += '4. التوكن: ' + data.accessToken + '\n';
      log += '5. المستخدم: ' + data.user.full_name + ' (' + data.user.role + ')\n';
      log += '\n✅ الدخول ناجح! التوكن: ' + data.accessToken + '\n';
      log += '6. اختبار الأعضاء...\n';
      var m = await fetch('/api/admin/members', {headers: {'Authorization': 'Bearer ' + data.accessToken}});
      var members = await m.json();
      log += '7. عدد الأعضاء: ' + members.length + '\n';
      log += JSON.stringify(members.map(function(x){return x.name + ' - ' + x.role}), null, 2);
      localStorage.setItem('majlis_admin_token', data.accessToken);
      log += '\n\n✅ تم حفظ التوكن! اضغط زر "دخول لوحة التحكم" بالأسفل';
    } else {
      log += '❌ فشل الدخول: ' + (data.error || 'خطأ غير معروف');
    }
  } catch(e) {
    log += '❌ خطأ: ' + e.message;
  }
  document.getElementById('result').textContent = log;
}
</script>
</body>
</html>
